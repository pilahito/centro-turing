name: Publicar

# Genera los adjuntos descargables de cada version y los sube al release:
#   - Centro-Turing-<version>.exe   (Windows, PyInstaller)
#   - centro-turing_<version>_all.deb (Linux)
#
# Se lanza solo al empujar una etiqueta v*, o a mano indicando la version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (por ejemplo 3.3.2). Vacio = la de la etiqueta."
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows .exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Calcular version
        id: v
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publicando la version $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar el panel
        run: pyinstaller --noconfirm centro-turing.spec

      - name: Renombrar con la version
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw "PyInstaller no ha generado ningun .exe" }
          Rename-Item $exe.FullName "Centro-Turing-$v.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Asegurar que el release existe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.v.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Centro Turing ${{ steps.v.outputs.version }}" --generate-notes
          }

      - name: Subir el .exe al release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.v.outputs.version }}"
          gh release upload $tag "dist/Centro-Turing-${{ steps.v.outputs.version }}.exe" --clobber

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: exe-windows
          path: dist/*.exe

  linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Calcular version
        id: v
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publicando la version $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_deb.py solo usa la biblioteca estandar: no hacen falta dependencias
      - name: Construir el paquete
        run: python tools/build_deb.py --version "${{ steps.v.outputs.version }}" --out dist

      - name: Asegurar que el release existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Centro Turing ${{ steps.v.outputs.version }}" --generate-notes

      - name: Subir el .deb al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          gh release upload "$tag" dist/*.deb --clobber

      - name: Guardar el .deb como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: deb-linux
          path: dist/*.deb
