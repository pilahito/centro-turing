# Tema SumiEspada_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Barra lateral estrecha de medidores y reloj grande a la derecha
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 200, 40, 40
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
