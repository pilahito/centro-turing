    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 210
        Y: 28
        WIDTH: 258
        HEIGHT: 50
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 36
        FONT_COLOR: 236, 232, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
