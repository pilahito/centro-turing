# Tema PeriodicoAntiguo_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Periodico antiguo: cabecera, titular con el tiempo, foto y cuatro columnas de cifras
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 236, 226, 200
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 300
        Y: 49
        WIDTH: 84
        HEIGHT: 13
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 10
        FONT_COLOR: 30, 26, 22
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 132
        Y: 49
        WIDTH: 78
        HEIGHT: 13
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 10
        FONT_COLOR: 30, 26, 22
        BACKGROUND_IMAGE: background.png
