# ---------------------------------------------------------------------------
# Tema GENERADO por Centro Turing (tools/generador_layout_ia.py)
# Pantalla : 3.5" landscape (480x320)
# Diseno   : IA (llama-server de Jan | Jan-v3.5-4B-Q4_K_XL)
# Fondo    : circuito | paneles cristal
# Fuentes  : jetbrains-mono/JetBrainsMono-Bold.ttf / roboto/Roboto-Bold.ttf
# Widgets  : reloj:texto, cpu_uso:barra, gpu_uso:radial, ram_uso:barra, disco_uso:barra, uptime:texto, ping:barra
# Es YAML normal: puedes editarlo a mano para ajustar posiciones o colores.
# ---------------------------------------------------------------------------
author: Generador IA Centro Turing
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 94, 0
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 11
        Y: 11
        WIDTH: 274
        HEIGHT: 45
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 35
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        MIN_SIZE: 0
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
    WEEKDAY:
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 290
        Y: 11
        WIDTH: 179
        HEIGHT: 23
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        MIN_SIZE: 0
        FORMAT: EEEE
    DAY:
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 290
        Y: 34
        WIDTH: 179
        HEIGHT: 23
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 136, 136, 136
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        MIN_SIZE: 0
        FORMAT: dd/MM/yyyy
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 11
        Y: 85
        WIDTH: 136
        HEIGHT: 17
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        MIN_SIZE: 0
      GRAPH:
        SHOW: true
        X: 11
        Y: 105
        WIDTH: 136
        HEIGHT: 8
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 94, 0
        BAR_OUTLINE: false
        BACKGROUND_IMAGE: background.png
  GPU:
    INTERVAL: 1
    PERCENTAGE:
      RADIAL:
        SHOW: true
        X: 210
        Y: 133
        RADIUS: 38
        WIDTH: 5
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 270
        ANGLE_END: 270
        ANGLE_STEPS: 1
        ANGLE_SEP: 0
        CLOCKWISE: true
        BAR_COLOR: 0, 170, 255
        SHOW_TEXT: true
        SHOW_UNIT: true
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
  MEMORY:
    INTERVAL: 3
    VIRTUAL:
      PERCENT_TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 273
        Y: 85
        WIDTH: 196
        HEIGHT: 19
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        MIN_SIZE: 0
      GRAPH:
        SHOW: true
        X: 273
        Y: 107
        WIDTH: 196
        HEIGHT: 6
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 255, 255
        BAR_OUTLINE: false
        BACKGROUND_IMAGE: background.png
  DISK:
    INTERVAL: 10
    USED:
      PERCENT_TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 11
        Y: 141
        WIDTH: 136
        HEIGHT: 22
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        MIN_SIZE: 0
      GRAPH:
        SHOW: true
        X: 11
        Y: 166
        WIDTH: 136
        HEIGHT: 7
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 94, 0
        BAR_OUTLINE: false
        BACKGROUND_IMAGE: background.png
  UPTIME:
    INTERVAL: 5
    FORMATTED:
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 273
        Y: 216
        WIDTH: 196
        HEIGHT: 27
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 0, 170, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        MIN_SIZE: 0
  PING:
    INTERVAL: 5
    TEXT:
      SHOW: true
      SHOW_UNIT: true
      X: 11
      Y: 210
      WIDTH: 246
      HEIGHT: 78
      FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
      FONT_SIZE: 63
      FONT_COLOR: 255, 255, 255
      BACKGROUND_IMAGE: background.png
      ALIGN: right
      ANCHOR: rt
      MIN_SIZE: 0
    GRAPH:
      SHOW: true
      X: 11
      Y: 291
      WIDTH: 246
      HEIGHT: 18
      MIN_VALUE: 0
      MAX_VALUE: 200
      BAR_COLOR: 255, 255, 255
      BAR_OUTLINE: true
      BACKGROUND_IMAGE: background.png
