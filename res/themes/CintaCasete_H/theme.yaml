        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 50
        Y: 34
        WIDTH: 232
        HEIGHT: 38
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 30
        FONT_COLOR: 50, 34, 30
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
