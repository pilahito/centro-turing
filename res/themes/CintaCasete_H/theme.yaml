# Tema CintaCasete_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Cinta de casete: reloj en la etiqueta, bobinas como medidores y vumetro abajo
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 230, 80, 60
static_images:
