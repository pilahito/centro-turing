# Tema GraficaLluvia_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Dos graficas grandes de historial de CPU y GPU
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 80, 180, 255
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 8
        Y: 4
        WIDTH: 170
        HEIGHT: 22
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 180, 230, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 186
        Y: 6
        WIDTH: 120
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 120, 190, 230
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
