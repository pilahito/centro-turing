# Tema Synthwave80_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Atardecer sintetico: dos semicirculos abajo, reloj cromado arriba y columna central
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 60, 200
static_images:
