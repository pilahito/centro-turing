# Tema NubeKawaii_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Temperatura enorme arriba a la izquierda y pastillas abajo
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 186, 90
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 304
        Y: 6
        WIDTH: 168
        HEIGHT: 28
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 60, 70, 120
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 304
        Y: 38
        WIDTH: 168
        HEIGHT: 18
        FONT: roboto/Roboto-BoldItalic.ttf
        FONT_SIZE: 13
        FONT_COLOR: 90, 80, 130
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
