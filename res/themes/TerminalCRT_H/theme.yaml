        SHOW: true
        SHOW_UNIT: true
        X: 16
        Y: 30
        WIDTH: 270
        HEIGHT: 44
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 30
        FONT_COLOR: 214, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
