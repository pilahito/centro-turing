# Tema TerminalCRT_H para Centro Turing (3.5" landscape, 480x320)
# Generado el 08/10/2026. Reloj: respeta CLOCK_FORMAT de config.yaml (12 o 24 h).
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 40, 255, 90
static_images:
