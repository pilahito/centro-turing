# Tema CabinaMecha_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Cuatro esferas en cuadro a la derecha y reloj en columna izquierda
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 90, 40
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 8
        Y: 8
        WIDTH: 188
        HEIGHT: 28
        FONT: geforce/GeForce-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 230, 236, 244
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 8
        Y: 40
        WIDTH: 120
        HEIGHT: 18
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 255, 140, 80
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
