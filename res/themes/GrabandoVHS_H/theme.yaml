# Tema GrabandoVHS_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Pantalla de video domestico: REC/PLAY, columna de cifras y reloj como contador
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 230, 30, 30
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 14
        Y: 252
        WIDTH: 240
        HEIGHT: 34
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 26
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 14
        Y: 292
        WIDTH: 150
        HEIGHT: 18
