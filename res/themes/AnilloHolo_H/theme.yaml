# Tema AnilloHolo_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Un anillo grande de CPU a la izquierda y columna de texto a la derecha
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 255, 210
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 220
        Y: 6
        WIDTH: 250
        HEIGHT: 28
        FONT: geforce/GeForce-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 200, 255, 245
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 220
        Y: 38
        WIDTH: 120
        HEIGHT: 18
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 0, 220, 200
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
      TEXT:
        FORMAT: d MMM y
        SHOW: true
        X: 344
        Y: 40
        WIDTH: 126
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
