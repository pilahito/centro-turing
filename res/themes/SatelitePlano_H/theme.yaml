# Tema SatelitePlano_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Reloj en el centro y cifras satelite en el perimetro
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 140, 190, 255
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 150
        Y: 108
        WIDTH: 180
        HEIGHT: 28
        FONT: geforce/GeForce-Bold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 220, 235, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 160
        Y: 142
        WIDTH: 160
        HEIGHT: 18
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 160, 200, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    DAY:
      TEXT:
        FORMAT: d MMM y
        SHOW: true
        X: 155
        Y: 164
        WIDTH: 170
        HEIGHT: 16
