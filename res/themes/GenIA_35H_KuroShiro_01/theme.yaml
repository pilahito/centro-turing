# ---------------------------------------------------------------------------
# Tema GENERADO por Centro Turing (tools/generador_layout_ia.py)
# Pantalla : 3.5" landscape (480x320)
# Diseno   : IA (llama-server de Jan | Jan-v3.5-4B-Q4_K_XL)
# Fondo    : ondas | paneles cristal
# Fuentes  : jetbrains-mono/JetBrainsMono-ExtraBold.ttf / roboto/Roboto-Bold.ttf
# Widgets  : reloj:texto, cpu_uso:texto, gpu_uso:radial, disco_uso:texto, uptime:texto
# Es YAML normal: puedes editarlo a mano para ajustar posiciones o colores.
# ---------------------------------------------------------------------------
author: Generador IA Centro Turing
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 107, 53
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 12
        Y: 12
        WIDTH: 273
        HEIGHT: 32
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        MIN_SIZE: 0
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
    WEEKDAY:
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 291
        Y: 12
        WIDTH: 177
        HEIGHT: 16
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        MIN_SIZE: 0
        FORMAT: EEEE
    DAY:
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 291
        Y: 28
        WIDTH: 177
        HEIGHT: 16
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 136, 136, 136
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        MIN_SIZE: 0
        FORMAT: dd/MM/yyyy
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 12
        Y: 74
        WIDTH: 170
        HEIGHT: 12
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 9
        FONT_COLOR: 255, 107, 53
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        MIN_SIZE: 0
  GPU:
    INTERVAL: 1
    PERCENTAGE:
      RADIAL:
        SHOW: true
        X: 97
        Y: 216
        RADIUS: 84
        WIDTH: 18
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 150
        ANGLE_END: 30
        ANGLE_STEPS: 1
        ANGLE_SEP: 0
        CLOCKWISE: true
        BAR_COLOR: 52, 152, 219
        SHOW_TEXT: true
        SHOW_UNIT: true
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 45
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
  DISK:
    INTERVAL: 10
    USED:
      PERCENT_TEXT:
        SHOW: true
        SHOW_UNIT: true
        X: 200
        Y: 136
        WIDTH: 224
        HEIGHT: 119
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 94
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        MIN_SIZE: 0
  UPTIME:
    INTERVAL: 5
    FORMATTED:
      TEXT:
        SHOW: false
        SHOW_UNIT: true
        X: 436
        Y: 183
        WIDTH: 32
        HEIGHT: 10
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 7
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        MIN_SIZE: 0
