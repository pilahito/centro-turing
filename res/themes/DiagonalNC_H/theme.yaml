# Tema DiagonalNC_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Informacion arriba a la izquierda y estadisticas solo abajo a la derecha
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 210, 40
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 10
        Y: 6
        WIDTH: 230
        HEIGHT: 32
        FONT: geforce/GeForce-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 230, 80
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 12
        Y: 42
        WIDTH: 110
        HEIGHT: 18
        FONT: roboto/Roboto-Medium.ttf
