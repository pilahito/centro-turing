# Tema CalculadoraLCD_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Calculadora solar: pantalla LCD con el reloj y cada cifra en una tecla
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 226, 120, 40
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 24
        Y: 18
        WIDTH: 432
        HEIGHT: 62
        FONT: digital/DIGITAL-7.TTF
        FONT_SIZE: 56
        FONT_COLOR: 34, 44, 30
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 24
        Y: 85
        WIDTH: 120
        HEIGHT: 20
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 34, 44, 30
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
