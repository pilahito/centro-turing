author: "Ayistax"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 70, 190

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 20
        Y: 118
        WIDTH: 118
        HEIGHT: 42
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 36
        FONT_COLOR: 255, 70, 190
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
      GRAPH:
        SHOW: True
        X: 20
        Y: 186
        WIDTH: 200
        HEIGHT: 12
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 70, 190
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 140
        Y: 128
        WIDTH: 80
        HEIGHT: 28
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 245, 245, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
