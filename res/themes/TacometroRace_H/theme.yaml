# Tema TacometroRace_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Tira digital arriba y un tacometro de CPU abajo en el centro
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 230, 40, 40
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 8
        Y: 4
        WIDTH: 220
        HEIGHT: 32
        FONT: digital/DIGITAL-7.TTF
        FONT_SIZE: 28
        FONT_COLOR: 0, 255, 170
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 372
        Y: 6
        WIDTH: 100
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 255, 80, 80
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
      TEXT:
        FORMAT: d MMM y
        SHOW: true
        X: 372
        Y: 24
        WIDTH: 100
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 200, 200, 205
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
