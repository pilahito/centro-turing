# Tema BandasMar_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Cinco bandas horizontales a sangre, una categoria centrada en cada una
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 80, 180, 220
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 40
        Y: 2
        WIDTH: 400
        HEIGHT: 30
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 24
        FONT_COLOR: 230, 248, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 12
        Y: 32
        WIDTH: 160
        HEIGHT: 16
        FONT: roboto/Roboto-BoldItalic.ttf
        FONT_SIZE: 12
        FONT_COLOR: 180, 220, 240
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
      TEXT:
        FORMAT: d MMM y
        SHOW: true
        X: 280
        Y: 32
        WIDTH: 184
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 180, 220, 240
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        SHOW_UNIT: false
