        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 34
        Y: 22
        WIDTH: 412
        HEIGHT: 96
        FONT: roboto/Roboto-Thin.ttf
        FONT_SIZE: 80
        FONT_COLOR: 255, 140, 40
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
