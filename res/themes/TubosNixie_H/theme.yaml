# Tema TubosNixie_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Tubos nixie: reloj fino naranja en un tubo largo, ocho tubos pequenos y placa de laton
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 120, 30
static_images:
