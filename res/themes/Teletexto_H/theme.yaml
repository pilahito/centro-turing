# Tema Teletexto_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Pagina de teletexto: cabecera P100, filas a dos columnas y barras de mosaico
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 0, 200
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 330
        Y: 6
        WIDTH: 144
        HEIGHT: 18
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 14
        FONT_COLOR: 255, 255, 0
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 176
        Y: 36
        WIDTH: 146
        HEIGHT: 22
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
