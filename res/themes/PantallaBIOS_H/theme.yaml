# Tema PantallaBIOS_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Pantalla de configuracion azul: tabla de claves y valores sin barras
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 0, 168
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 168
        Y: 35
        WIDTH: 136
        HEIGHT: 15
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 11
        FONT_COLOR: 255, 255, 85
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 168
        Y: 52
        WIDTH: 136
        HEIGHT: 15
