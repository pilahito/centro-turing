# Tema Jukebox_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Gramola: reloj en la cupula, cifras en tarjetas de canciones y red en la rejilla
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 120, 200
static_images:
