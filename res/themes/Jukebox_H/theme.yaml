        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 70
        Y: 18
        WIDTH: 236
        HEIGHT: 48
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 34
        FONT_COLOR: 255, 220, 120
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
