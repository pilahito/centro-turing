# Tema LluviaHolo_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 80, 200, 255
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        SHOW: true
        X: 16
        Y: 12
        WIDTH: 210
        HEIGHT: 40
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 30
        FONT_COLOR: 220, 245, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 16
        Y: 56
        WIDTH: 110
        HEIGHT: 18
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 14
        FONT_COLOR: 80, 210, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
