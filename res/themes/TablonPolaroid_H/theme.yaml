# Tema TablonPolaroid_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Tablon de corcho: cuatro fotos con los porcentajes, nota adhesiva con reloj y tiempo y un ticket con la red
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 236, 110
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 326
        Y: 24
        WIDTH: 138
        HEIGHT: 32
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 24
        FONT_COLOR: 40, 40, 90
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 326
        Y: 60
        WIDTH: 138
        HEIGHT: 18
        FONT: roboto/Roboto-BoldItalic.ttf
        FONT_SIZE: 14
        FONT_COLOR: 40, 40, 90
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
