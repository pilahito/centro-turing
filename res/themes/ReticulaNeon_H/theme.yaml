# Tema ReticulaNeon_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Cuatro esquinas con lecturas y el centro libre con la reticula
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 40, 160
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 8
        Y: 4
        WIDTH: 160
        HEIGHT: 20
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 0, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 8
        Y: 26
        WIDTH: 110
        HEIGHT: 16
