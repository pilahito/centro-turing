author: CentroTuring
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 80, 200, 190
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: True
        X: 20
        Y: 40
        FONT: digital/DIGITAL-7.TTF
        FONT_SIZE: 42
        FONT_COLOR: 80, 200, 190
        SHOW_UNIT: True
  GPU:
    INTERVAL: 1
    PERCENTAGE:
      TEXT:
        SHOW: True
        X: 20
        Y: 140
        FONT: digital/DIGITAL-7.TTF
        FONT_SIZE: 42
        FONT_COLOR: 80, 200, 190
        SHOW_UNIT: True
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: True
        FORMAT: "HH:mm"
        X: 360
        Y: 16
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 80, 200, 190
  WEATHER:
    INTERVAL: 300
    TEMPERATURE:
      TEXT:
        SHOW: True
        X: 20
        Y: 240
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 80, 200, 190

