# Tema MenuRPG_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Menu de rol de 8 bits: grupo con barras de PV, ventana de reloj, menu y cuadro de dialogo
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 16, 24, 120
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 330
        Y: 12
        WIDTH: 140
        HEIGHT: 26
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 18
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 330
        Y: 42
        WIDTH: 140
        HEIGHT: 18
