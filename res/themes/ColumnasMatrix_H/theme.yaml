# Tema ColumnasMatrix_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Tres columnas de texto, sin barras ni esferas
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 255, 70
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 8
        Y: 16
        WIDTH: 148
        HEIGHT: 22
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 180, 255, 180
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 8
        Y: 42
        WIDTH: 148
        HEIGHT: 16
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
