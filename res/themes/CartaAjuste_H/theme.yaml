# Tema CartaAjuste_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Televisor antiguo con carta de ajuste: reloj en el circulo y cifras en la franja negra
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 192, 192, 0
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 100
        Y: 112
        WIDTH: 216
        HEIGHT: 46
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 36
        FONT_COLOR: 235, 235, 235
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 122
        Y: 48
        WIDTH: 174
        HEIGHT: 14
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 11
        FONT_COLOR: 235, 235, 235
