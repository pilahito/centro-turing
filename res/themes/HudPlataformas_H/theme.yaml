# Tema HudPlataformas_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Marcador de plataformas arriba; red en la nube y tiempo en el cartel
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 252, 152, 56
static_images:
