# Tema EscenarioIdol_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Arte a la izquierda y lista de cifras apilada a la derecha
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
