# Tema ChibiPastel_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 140, 180
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        SHOW: true
        X: 16
        Y: 12
        WIDTH: 230
        HEIGHT: 42
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 34
        FONT_COLOR: 90, 40, 70
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 16
        Y: 58
        WIDTH: 120
        HEIGHT: 20
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 210, 60, 110
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
    DAY:
