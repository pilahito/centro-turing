        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 8
        Y: 4
        WIDTH: 168
        HEIGHT: 20
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 140, 255, 170
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
