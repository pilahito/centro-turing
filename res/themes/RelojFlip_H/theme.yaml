# Tema RelojFlip_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Reloj de paletas: una paleta grande con la hora, cuatro pequenas con porcentajes y lineas abajo
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 240, 230, 210
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 48
        Y: 16
        WIDTH: 384
        HEIGHT: 86
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 66
        FONT_COLOR: 240, 238, 230
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
