# Tema ChipDorado_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Cifras colocadas sobre chips sueltos de la placa, no en una cuadricula
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 212, 175, 55
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 136
        Y: 14
        WIDTH: 200
        HEIGHT: 24
        FONT: geforce/GeForce-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 230, 245, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 136
        Y: 42
        WIDTH: 100
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 180, 220, 170
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
