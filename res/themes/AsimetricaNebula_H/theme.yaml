# Tema AsimetricaNebula_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Reloj enorme arriba a la derecha, tiempo al centro-izquierda y bloque compacto abajo a la izquierda
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 180, 90, 255
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 186
        Y: 6
        WIDTH: 284
        HEIGHT: 44
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 32
        FONT_COLOR: 245, 240, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: right
        ANCHOR: rt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 250
        Y: 52
        WIDTH: 100
        HEIGHT: 18
        FONT: roboto/Roboto-BoldItalic.ttf
        FONT_SIZE: 13
        FONT_COLOR: 220, 170, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
