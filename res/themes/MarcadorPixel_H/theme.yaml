# Tema MarcadorPixel_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Marcador de arcade: rango, nombre y puntuacion, sin barras
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 220, 80
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 150
        Y: 2
        WIDTH: 190
        HEIGHT: 28
        FONT: geforce/GeForce-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 255, 230, 80
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 16
        Y: 36
        WIDTH: 130
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 12
        FONT_COLOR: 255, 220, 120
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
      TEXT:
        FORMAT: d MMM y
        SHOW: true
        X: 160
        Y: 36
        WIDTH: 150
        HEIGHT: 16
        FONT: roboto/Roboto-Medium.ttf
