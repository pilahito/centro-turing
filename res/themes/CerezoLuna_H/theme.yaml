# Tema CerezoLuna_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Reloj gigante centrado y una fila minima de cifras abajo
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 150, 185
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 20
        Y: 58
        WIDTH: 440
        HEIGHT: 60
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 46
        FONT_COLOR: 255, 244, 248
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 40
        Y: 126
        WIDTH: 170
        HEIGHT: 22
        FONT: roboto/Roboto-BoldItalic.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 180, 200
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
