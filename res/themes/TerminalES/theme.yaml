          SHOW: True
          X: 360
          Y: 244
          WIDTH: 100
          HEIGHT: 18
          FONT: generale-mono/GeneraleMonoA.ttf
          FONT_SIZE: 14
          FONT_COLOR: 70, 160, 90
          BACKGROUND_IMAGE: background.png
          ALIGN: left
          ANCHOR: lt
  DATE:
    INTERVAL: 1
    DAY:
      TEXT:
        FORMAT: "dd/MM/yyyy"
        SHOW: True
        X: 320
        Y: 280
        WIDTH: 130
        HEIGHT: 20
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 14
        FONT_COLOR: 210, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
    HOUR:
      TEXT:
        FORMAT: "HH:mm:ss"
        SHOW: True
        X: 80
        Y: 280
        WIDTH: 120
        HEIGHT: 20
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 14
        FONT_COLOR: 210, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
