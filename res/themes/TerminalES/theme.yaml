author: "Ayistax"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 80, 255, 110

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 22
        Y: 72
        WIDTH: 80
        HEIGHT: 28
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 22
        FONT_COLOR: 210, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
      GRAPH:
        SHOW: True
        X: 110
        Y: 80
        WIDTH: 220
        HEIGHT: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 110, 255, 140
        BAR_OUTLINE: True
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 250
        Y: 72
        WIDTH: 80
        HEIGHT: 28
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 22
        FONT_COLOR: 110, 255, 140
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
  GPU:
    INTERVAL: 1
    PERCENTAGE:
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 22
        Y: 128
        WIDTH: 80
        HEIGHT: 28
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 22
        FONT_COLOR: 210, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
      GRAPH:
        SHOW: True
        X: 110
        Y: 136
        WIDTH: 220
        HEIGHT: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 110, 255, 140
        BAR_OUTLINE: True
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 250
        Y: 128
        WIDTH: 80
        HEIGHT: 28
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 22
        FONT_COLOR: 110, 255, 140
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
  MEMORY:
    INTERVAL: 5
    VIRTUAL:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 250
        Y: 164
        WIDTH: 70
        HEIGHT: 22
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 210, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
      GRAPH:
        SHOW: True
        X: 330
        Y: 172
        WIDTH: 124
        HEIGHT: 8
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 110, 255, 140
        BAR_OUTLINE: True
        BACKGROUND_IMAGE: background.png
  DISK:
    INTERVAL: 10
    USED:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 250
        Y: 204
        WIDTH: 70
        HEIGHT: 22
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 16
        FONT_COLOR: 210, 255, 220
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
      GRAPH:
        SHOW: True
        X: 330
        Y: 212
        WIDTH: 124
        HEIGHT: 8
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 110, 255, 140
        BAR_OUTLINE: True
        BACKGROUND_IMAGE: background.png
  NET:
    INTERVAL: 1
    ETH:
      DOWNLOAD:
        TEXT:
          SHOW: True
          X: 250
          Y: 244
          WIDTH: 100
          HEIGHT: 18
          FONT: generale-mono/GeneraleMonoA.ttf
          FONT_SIZE: 14
          FONT_COLOR: 210, 255, 220
          BACKGROUND_IMAGE: background.png
          ALIGN: left
          ANCHOR: lt
      UPLOAD:
