# Tema Osciloscopio_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Osciloscopio: dos canales con historial de CPU y GPU, ruedas con cifras y tira LCD
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 80, 255, 140
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 16
        Y: 280
        WIDTH: 133
        HEIGHT: 26
        FONT: digital/DIGITAL-7.TTF
        FONT_SIZE: 26
        FONT_COLOR: 140, 255, 170
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 150
        Y: 278
        WIDTH: 96
        HEIGHT: 14
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 10
        FONT_COLOR: 140, 255, 170
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
