# Tema Ventana95_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Ventana de escritorio de los 90 con grupos, barra de estado y reloj en la bandeja
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 128, 128
static_images:
