# Tema HifiMadera_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Equipo de musica de madera: dos vumetros de aguja, dial con reloj y filas inferiores
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 170, 60
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 22
        Y: 244
        WIDTH: 180
        HEIGHT: 25
        FONT: roboto/Roboto-Black.ttf
        FONT_SIZE: 20
        FONT_COLOR: 255, 170, 60
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 210
        Y: 248
        WIDTH: 110
        HEIGHT: 18
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 255, 170, 60
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
      TEXT:
        FORMAT: d MMM y
        SHOW: true
        X: 326
        Y: 248
        WIDTH: 134
        HEIGHT: 18
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 13
        FONT_COLOR: 255, 170, 60
