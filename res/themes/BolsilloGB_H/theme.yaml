# Tema BolsilloGB_H para Centro Turing (3.5" landscape, 480x320)
# 08/10/2026. Consola de bolsillo: todo dentro de la pantalla verde de cuatro tonos
# Reloj segun CLOCK_FORMAT (12 o 24 h). Tiempo: Open-Meteo.
author: Ayistax
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 155, 188, 15
static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        FORMAT: HH:mm
        FORMAT_12: h:mm a
        FORMAT_24: HH:mm
        SHOW: true
        X: 48
        Y: 34
        WIDTH: 250
        HEIGHT: 40
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 30
        FONT_COLOR: 15, 56, 15
        BACKGROUND_IMAGE: background.png
        ALIGN: center
        ANCHOR: mt
        SHOW_UNIT: false
    WEEKDAY:
      TEXT:
        FORMAT: EEEE
        SHOW: true
        X: 48
        Y: 76
        WIDTH: 96
        HEIGHT: 14
        FONT: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
        FONT_SIZE: 10
        FONT_COLOR: 48, 98, 48
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
        SHOW_UNIT: false
    DAY:
      TEXT:
        FORMAT: d MMM y
